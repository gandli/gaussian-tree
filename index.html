<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaussian Tree</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1c20; }
      #ui {
        position: fixed; top: 12px; right: 12px; width: 300px;
        background: #22252b; color: #e6e6e6; border-radius: 8px;
        padding: 14px 16px; font: 13px/1.5 system-ui, sans-serif;
        max-height: calc(100vh - 24px); overflow-y: auto;
      }
      #ui h2 { font-size: 15px; margin: 0 0 10px; color: #fff; }
      #ui label { display: block; margin: 8px 0 2px; color: #9aa0a8; }
      #ui input[type="range"] { width: 100%; }
      #ui .row { display: flex; gap: 8px; margin-top: 12px; }
      #ui button {
        flex: 1; padding: 7px 0; border: 0; border-radius: 6px;
        background: #3b6ea5; color: #fff; cursor: pointer; font-size: 13px;
      }
      #ui button:hover { background: #4a82c4; }
      #ui .stats { margin-top: 10px; color: #9aa0a8; font-size: 12px; }
      #ui .seed { width: 100%; box-sizing: border-box; background: #2a2e35; color: #e6e6e6; border: 1px solid #3a3f46; border-radius: 4px; padding: 4px 6px; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="ui">
      <h2>Gaussian Tree</h2>
      <label>Seed <input class="seed" id="seed" type="number" value="1337" /></label>
      <label>Trunk height: <span id="trunkHeightV">6</span></label>
      <input id="trunkHeight" type="range" min="3" max="12" value="6" step="0.5" />
      <label>Trunk radius: <span id="trunkRadiusV">0.4</span></label>
      <input id="trunkRadius" type="range" min="0.1" max="1" value="0.4" step="0.05" />
      <label>Levels: <span id="levelsV">5</span></label>
      <input id="levels" type="range" min="2" max="6" value="5" step="1" />
      <label>Branches/level: <span id="branchesPerLevelV">4</span></label>
      <input id="branchesPerLevel" type="range" min="2" max="6" value="4" step="1" />
      <label>Branch angle: <span id="branchAngleV">35</span></label>
      <input id="branchAngle" type="range" min="10" max="70" value="35" step="1" />
      <label>Down angle: <span id="downAngleV">15</span></label>
      <input id="downAngle" type="range" min="0" max="40" value="15" step="1" />
      <label>Leaves/tip: <span id="leavesPerTipV">30</span></label>
      <input id="leavesPerTip" type="range" min="2" max="60" value="30" step="1" />
      <div class="row">
        <button id="regenerate">Regenerate</button>
        <button id="export">Export .spz</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
